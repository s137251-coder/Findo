# Checks every pull request the way a release would be built: analysis, the
# tests, and a release-mode APK -- release mode because R8 and resource
# shrinking only run there, and both have broken this app before when a debug
# build was fine. Signed with the debug keys, so it needs no secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: The rules file is what the generator writes
        run: |
          python3 tool/build_rules.py
          git diff --exit-code firestore.rules

      - name: Build a release APK
        run: flutter build apk --release
