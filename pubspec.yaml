name: findo
description: "Findo - a 2D hidden object search game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Game engine and audio
  flame: ^1.38.2
  flame_audio: ^2.12.2

  # Persistence
  shared_preferences: ^2.5.5

  # Monetization and privacy
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  app_tracking_transparency: ^2.0.7

  # Formatting
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/maps/
    - assets/images/maps/meta/
    - assets/images/targets/
    - assets/audio/
    - assets/locales/

  fonts:
    - family: Findo
      fonts:
        - asset: assets/fonts/Findo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Findo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Findo-Bold.ttf
          weight: 700
